<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permutations and Combinations Applet</title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Load Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom scrollbar for better embedding experience */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Icon Components (Inline SVGs to avoid dependencies) ---

        const Calculator = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
        );

        const Settings = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );

        const ListIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
        );

        const AlertCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );

        const Shuffle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l14.2-12.9"/><path d="M2 5h1.4c1.3 0 2.5.6 3.3 1.7l1.6 1.6"/><path d="M15 15l2.8 2.8c.8 1.1 2 1.7 3.3 1.7H22"/><path d="M18 2l4 4-4 4"/><path d="M18 14l4 4-4 4"/></svg>
        );

        const Layers = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        );

        const SplitIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="3" y2="21"/></svg>
        );

        // --- Math Helpers ---

        const factorial = (num) => {
            if (num < 0) return -1;
            if (num === 0) return 1;
            let res = 1;
            for (let i = 2; i <= num; i++) res *= i;
            return res;
        };

        const calculatePermutations = (n, r) => {
            if (r < 0 || r > n) return 0;
            return factorial(n) / factorial(n - r);
        };

        const calculateCombinations = (n, r) => {
            if (r < 0 || r > n) return 0;
            return factorial(n) / (factorial(r) * factorial(n - r));
        };

        // --- JSX Formula Renderers ---

        const renderPermutationFormula = (n, r) => {
            if (r === 0) return <span>1</span>;
            if (r > n) return <span>0</span>;
            const terms = [];
            for (let i = 0; i < r; i++) {
                terms.push(n - i);
            }
            return <span>{terms.join('×')}</span>;
        };

        const renderCombinationFormula = (n, r) => {
            if (r === 0) return <span>1</span>;
            if (r > n) return <span>0</span>;

            const numTerms = [];
            for (let i = 0; i < r; i++) {
                numTerms.push(n - i);
            }

            const denomTerms = [];
            for (let i = 0; i < r; i++) {
                denomTerms.push(r - i);
            }

            // Render as vertical fraction
            return (
                <div className="inline-flex flex-col text-center align-middle mx-1" style={{verticalAlign: 'middle'}}>
                    <div className="border-b border-gray-400 leading-none pb-1 mb-1 px-1">{numTerms.join('×')}</div>
                    <div className="leading-none px-1">{denomTerms.join('×')}</div>
                </div>
            );
        };

        // --- Color & Grouping Helpers ---

        const COLOR_PALETTE = [
            'bg-red-200 text-red-900 border-red-300',
            'bg-blue-200 text-blue-900 border-blue-300',
            'bg-green-200 text-green-900 border-green-300',
            'bg-orange-200 text-orange-900 border-orange-300',
            'bg-purple-200 text-purple-900 border-purple-300',
            'bg-cyan-200 text-cyan-900 border-cyan-300',
            'bg-pink-200 text-pink-900 border-pink-300',
            'bg-lime-200 text-lime-900 border-lime-300',
            'bg-indigo-200 text-indigo-900 border-indigo-300',
            'bg-amber-200 text-amber-900 border-amber-300',
            'bg-teal-200 text-teal-900 border-teal-300',
            'bg-rose-200 text-rose-900 border-rose-300',
            'bg-sky-200 text-sky-900 border-sky-300',
            'bg-emerald-200 text-emerald-900 border-emerald-300',
            'bg-violet-200 text-violet-900 border-violet-300',
            'bg-fuchsia-200 text-fuchsia-900 border-fuchsia-300',
            'bg-yellow-200 text-yellow-900 border-yellow-300',
            'bg-slate-200 text-slate-900 border-slate-300',
        ];

        const getItemKey = (item) => [...item].sort().join('');

        const getItemColor = (item) => {
            const key = getItemKey(item);
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = key.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % COLOR_PALETTE.length;
            return COLOR_PALETTE[index];
        };

        // --- Generators ---

        const MAX_DISPLAY_ITEMS = 1000;

        const generatePermutations = (arr, r, limit = MAX_DISPLAY_ITEMS) => {
            const results = [];

            const permute = (current, remaining) => {
                if (results.length >= limit) return;
                if (current.length === r) {
                    results.push(current);
                    return;
                }

                for (let i = 0; i < remaining.length; i++) {
                    if (results.length >= limit) return;
                    const next = current.concat(remaining[i]);
                    const nextRemaining = [...remaining.slice(0, i), ...remaining.slice(i + 1)];
                    permute(next, nextRemaining);
                }
            };

            permute([], arr);
            return results;
        };

        const generateCombinations = (arr, r, limit = MAX_DISPLAY_ITEMS) => {
            const results = [];

            const combine = (start, current) => {
                if (results.length >= limit) return;
                if (current.length === r) {
                    results.push(current);
                    return;
                }

                for (let i = start; i < arr.length; i++) {
                    if (results.length >= limit) return;
                    combine(i + 1, current.concat(arr[i]));
                }
            };

            combine(0, []);
            return results;
        };

        // --- Main App Component ---

        const MathSymbol = ({ symbol, n, r }) => (
            <span className="inline-flex items-center font-serif italic">
                {symbol}
                <span className="flex flex-col text-[0.5em] leading-none ml-0.5">
                    <span>{n}</span>
                    <span>{r}</span>
                </span>
            </span>
        );

        // --- Result List Component for Reuse ---
        const ResultList = ({ items, total, title, r }) => {
            const isTruncated = total > MAX_DISPLAY_ITEMS;
            const displayList = items.slice(0, MAX_DISPLAY_ITEMS);

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100 bg-gray-50/50 flex-shrink-0">
                        <h3 className="font-semibold text-gray-700 flex items-center gap-2 text-sm md:text-base">
                            {title}
                        </h3>
                        <div className="text-xs font-medium text-gray-500 bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">
                            {displayList.length.toLocaleString()} / {total.toLocaleString()}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 bg-slate-50 relative">
                        {total === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                <AlertCircle className="w-10 h-10 mb-2 opacity-20" />
                                <p className="text-sm">無結果</p>
                            </div>
                        ) : (
                            <>
                                {isTruncated && (
                                    <div className="mb-4 bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded-lg text-xs flex items-center gap-2">
                                        <AlertCircle className="w-4 h-4 text-amber-500 flex-shrink-0" />
                                        <span>顯示前 {MAX_DISPLAY_ITEMS} 筆</span>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    {displayList.map((item, idx) => (
                                        <div
                                            key={idx}
                                            className={`
                                                group relative overflow-hidden rounded border shadow-sm transition-all duration-200 hover:shadow-md hover:-translate-y-0.5
                                                ${getItemColor(item)}
                                            `}
                                        >
                                            <div className="flex items-center justify-center p-2">
                                                <div className={`flex ${r >= 6 ? 'gap-0' : 'gap-0.5'}`}>
                                                    {item.map((char, charIdx) => (
                                                        <span
                                                            key={charIdx}
                                                            className={`
                                                                ${r >= 6 ? 'w-4 text-sm' : 'w-5 text-base'}
                                                                h-6 flex items-center justify-center font-bold rounded-sm bg-white/40
                                                            `}
                                                        >
                                                            {char}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="absolute top-0.5 right-1 text-[8px] font-mono opacity-50">
                                                {idx + 1}
                                            </div>
                                        </div>
                                    ))}

                                    {isTruncated && (
                                        <div className="flex items-center justify-center p-2 rounded border-2 border-dashed border-gray-200 bg-gray-50/50 text-gray-400 font-medium text-xs">
                                            + {total - MAX_DISPLAY_ITEMS}...
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [n, setN] = useState(4);
            const [r, setR] = useState(2);
            const [activeTab, setActiveTab] = useState('permutations'); // 'permutations' | 'combinations' | 'compare'

            useEffect(() => {
                if (r > n) setR(n);
            }, [n, r]);

            const sourceObjects = useMemo(() => {
                return Array.from({ length: n }, (_, i) => String.fromCharCode(65 + i));
            }, [n]);

            const totalPermutations = useMemo(() => calculatePermutations(n, r), [n, r]);
            const totalCombinations = useMemo(() => calculateCombinations(n, r), [n, r]);

            // Always generate both lists for flexibility
            const permList = useMemo(() => {
                let items = generatePermutations(sourceObjects, r);
                items.sort((a, b) => {
                    const keyA = getItemKey(a);
                    const keyB = getItemKey(b);
                    if (keyA < keyB) return -1;
                    if (keyA > keyB) return 1;
                    return a.join('') < b.join('') ? -1 : 1;
                });
                return items;
            }, [n, r, sourceObjects]);

            const combList = useMemo(() => {
                return generateCombinations(sourceObjects, r);
            }, [n, r, sourceObjects]);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto space-y-4">

                        {/* Header */}
                        <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-2">
                            <div>
                                <h1 className="text-3xl font-extrabold text-indigo-900 tracking-tight flex items-center gap-3">
                                    <Calculator className="w-8 h-8 text-indigo-600" />
                                    排列與組合 (Permutations & Combinations)
                                </h1>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">

                            {/* Left Column: Controls & Stats */}
                            <div className="lg:col-span-4 space-y-6">

                                {/* Controls Card */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="bg-gray-50 px-6 py-4 border-b border-gray-100 flex items-center gap-2">
                                        <Settings className="w-4 h-4 text-gray-400" />
                                        <h2 className="text-sm font-semibold text-gray-600 tracking-wider">探索從 n 個相異物件中選取 r 個的方法</h2>
                                    </div>

                                    <div className="p-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            {/* N Select */}
                                            <div className="space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-base font-bold text-gray-700 truncate" title="物件總數 (n)">
                                                        總數 (n)
                                                    </label>
                                                    <span className="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full text-xs font-bold">
                                                        {n}
                                                    </span>
                                                </div>

                                                <div className="relative">
                                                    <select
                                                        value={n}
                                                        onChange={(e) => setN(parseInt(e.target.value))}
                                                        className="w-full p-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block"
                                                    >
                                                        {[1, 2, 3, 4, 5, 6].map((num) => (
                                                            <option key={num} value={num}>{num}</option>
                                                        ))}
                                                    </select>
                                                </div>

                                                <div className="flex flex-wrap gap-1">
                                                    {sourceObjects.map((char) => (
                                                        <span key={char} className="inline-flex items-center justify-center w-5 h-5 text-[10px] font-medium bg-gray-100 text-gray-600 rounded">
                                                            {char}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* R Select */}
                                            <div className="space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-base font-bold text-gray-700 truncate" title="選取數量 (r)">
                                                        選取 (r)
                                                    </label>
                                                    <span className="bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full text-xs font-bold">
                                                        {r}
                                                    </span>
                                                </div>

                                                <div className="relative">
                                                    <select
                                                        value={r}
                                                        onChange={(e) => setR(parseInt(e.target.value))}
                                                        className="w-full p-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-pink-500 focus:border-pink-500 block"
                                                    >
                                                        {Array.from({ length: n }, (_, i) => i + 1).map((num) => (
                                                            <option key={num} value={num}>{num}</option>
                                                        ))}
                                                    </select>
                                                </div>

                                                <div className="flex flex-wrap gap-1">
                                                    {Array.from({ length: r }).map((_, i) => (
                                                        <div key={i} className="w-5 h-5 border-2 border-dashed border-gray-300 rounded flex items-center justify-center">
                                                            <span className="w-1 h-1 bg-gray-300 rounded-full"></span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Formula & Totals Card */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="grid grid-cols-2 divide-x divide-gray-100">
                                        {/* Permutations Stat */}
                                        <button
                                            onClick={() => setActiveTab('permutations')}
                                            className={`p-4 w-full text-left transition-colors relative group ${activeTab === 'permutations' ? 'bg-indigo-50/50' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="flex items-center gap-2 mb-2">
                                                <Shuffle className={`w-4 h-4 ${activeTab === 'permutations' ? 'text-indigo-600' : 'text-gray-400'}`} />
                                                <span className={`text-xs font-bold uppercase tracking-wider ${activeTab === 'permutations' ? 'text-indigo-600' : 'text-gray-500'}`}>排列</span>
                                            </div>
                                            <div className="text-2xl font-black text-gray-900 tracking-tight truncate flex items-center gap-2">
                                                <MathSymbol symbol="P" n={n} r={r} />
                                                <span>= {totalPermutations.toLocaleString()}</span>
                                            </div>
                                            <div className="mt-2 text-lg text-gray-600 font-mono break-words leading-relaxed flex items-center gap-2">
                                                <MathSymbol symbol="P" n={n} r={r} />
                                                <span className="mx-1">=</span>
                                                {renderPermutationFormula(n, r)}
                                            </div>
                                            {activeTab === 'permutations' && (
                                                <div className="absolute bottom-0 left-0 right-0 h-1 bg-indigo-600"></div>
                                            )}
                                        </button>

                                        {/* Combinations Stat */}
                                        <button
                                            onClick={() => setActiveTab('combinations')}
                                            className={`p-4 w-full text-left transition-colors relative group ${activeTab === 'combinations' ? 'bg-emerald-50/50' : 'hover:bg-gray-50'}`}
                                        >
                                            <div className="flex items-center gap-2 mb-2">
                                                <Layers className={`w-4 h-4 ${activeTab === 'combinations' ? 'text-emerald-600' : 'text-gray-400'}`} />
                                                <span className={`text-xs font-bold uppercase tracking-wider ${activeTab === 'combinations' ? 'text-emerald-600' : 'text-gray-500'}`}>組合</span>
                                            </div>
                                            <div className="text-2xl font-black text-gray-900 tracking-tight truncate flex items-center gap-2">
                                                <MathSymbol symbol="C" n={n} r={r} />
                                                <span>= {totalCombinations.toLocaleString()}</span>
                                            </div>
                                            <div className="mt-2 text-lg text-gray-600 font-mono break-words leading-relaxed flex items-center gap-2">
                                                <MathSymbol symbol="C" n={n} r={r} />
                                                <span className="mx-1">=</span>
                                                {renderCombinationFormula(n, r)}
                                            </div>
                                            {activeTab === 'combinations' && (
                                                <div className="absolute bottom-0 left-0 right-0 h-1 bg-emerald-500"></div>
                                            )}
                                        </button>
                                    </div>

                                    {/* Compare Button */}
                                    <div className="border-t border-gray-100">
                                        <button
                                            onClick={() => setActiveTab('compare')}
                                            className={`w-full p-4 flex items-center justify-center gap-2 transition-colors ${activeTab === 'compare' ? 'bg-gray-100 text-gray-900' : 'text-gray-600 hover:bg-gray-50'}`}
                                        >
                                            <SplitIcon className="w-4 h-4" />
                                            <span className="font-bold text-sm">同時顯示 (Show Both)</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Educational Context */}
                                <div className={`border rounded-xl p-4 text-sm transition-colors ${
                                    activeTab === 'permutations'
                                        ? 'bg-indigo-50 border-indigo-100 text-indigo-800'
                                        : activeTab === 'combinations'
                                        ? 'bg-emerald-50 border-emerald-100 text-emerald-800'
                                        : 'bg-gray-50 border-gray-200 text-gray-700'
                                    }`}>
                                    <div className="flex gap-2">
                                        <AlertCircle className={`w-5 h-5 flex-shrink-0 ${
                                            activeTab === 'permutations' ? 'text-indigo-500' : activeTab === 'combinations' ? 'text-emerald-500' : 'text-gray-500'
                                        }`} />
                                        <div>
                                            <p className="font-semibold mb-1">
                                                {activeTab === 'permutations' ? '順序重要 (Order Matters)'
                                                 : activeTab === 'combinations' ? '順序不重要 (Order Does Not Matter)'
                                                 : '比較模式 (Comparison Mode)'}
                                            </p>
                                            <p className="opacity-80 leading-relaxed">
                                                {activeTab === 'permutations'
                                                ? <React.Fragment>在排列中，<strong>AB</strong> 與 <strong>BA</strong> 是不同的。但為了方便比較，相同元素的排列(如ABC, BAC)在下方已被以相同顏色分組在一起。</React.Fragment>
                                                : activeTab === 'combinations'
                                                ? <React.Fragment>在組合中，<strong>AB</strong> 與 <strong>BA</strong> 是相同的。相同元素的組合使用單一顏色表示。</React.Fragment>
                                                : <React.Fragment>左側顯示排列 (考慮順序)，右側顯示組合 (不考慮順序)。觀察相同顏色的項目，排列會將同一個組合展開成多種順序。</React.Fragment>
                                                }
                                            </p>
                                        </div>
                                    </div>
                                </div>

                            </div>

                            {/* Right Column: Visualization Area */}
                            <div className="lg:col-span-8 flex flex-col h-[750px] bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                {activeTab === 'compare' ? (
                                    <div className="flex-1 grid grid-cols-2 divide-x divide-gray-200 overflow-hidden">
                                        <ResultList
                                            title="所有排列"
                                            items={permList}
                                            total={totalPermutations}
                                            r={r}
                                        />
                                        <ResultList
                                            title="所有組合"
                                            items={combList}
                                            total={totalCombinations}
                                            r={r}
                                        />
                                    </div>
                                ) : (
                                    <ResultList
                                        title={activeTab === 'permutations' ? '所有排列 (All Permutations)' : '所有組合 (All Combinations)'}
                                        items={activeTab === 'permutations' ? permList : combList}
                                        total={activeTab === 'permutations' ? totalPermutations : totalCombinations}
                                        r={r}
                                    />
                                )}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
